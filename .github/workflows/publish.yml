name: Publish
on:
  release:
    types: [released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-wheels:
    name: Build wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - {os: macos-26,         arch: "arm64,x86_64", build: "cp3{11,12,13,14,15}-*",          dist: "macos"}
        - {os: ubuntu-24.04,     arch: auto,           build: "cp3{11,12,13,14,15}-manylinux*", dist: "manylinux-amd"}
        - {os: ubuntu-24.04,     arch: auto,           build: "cp3{11,12,13,14,15}-musllinux*", dist: "musllinux-amd"}
        - {os: ubuntu-24.04-arm, arch: auto,           build: "cp3{11,12,13,14,15}-manylinux*", dist: "manylinux-arm"}
        - {os: ubuntu-24.04-arm, arch: auto,           build: "cp3{11,12,13,14,15}-musllinux*", dist: "musllinux-arm"}
        - {os: windows-latest,   arch: AMD64,          build: "cp3{11,12,13,14,15}-*",          dist: "windows-amd"}
        - {os: windows-11-arm,   arch: ARM64,          build: "cp3{11,12,13,14,15}-*",          dist: "windows-arm"}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build }}
      name: Build wheels
      uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
    - name: Upload wheels
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ matrix.dist }}
        path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
    - name: Build sdist
      run: uv build --sdist
    - name: Upload sdist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  upload-to-testpypi:
    name: Publish release to Test PyPI
    environment: testpypi
    needs: [build-wheels, build-sdist]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        merge-multiple: true
        path: dist
        pattern: dist-*
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/

  upload-to-pypi:
    name: Publish release to PyPI
    environment: pypi
    needs: [build-wheels, build-sdist, upload-to-testpypi]
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        merge-multiple: true
        path: dist
        pattern: dist-*
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
