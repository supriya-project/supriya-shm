name: Test

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "3.14"
    - name: Install supriya-shm
      run: uv sync
    - name: Format check
      run: uv run ruff format --check src/ tests/
    - name: Lint
      run: uv run ruff check src/ tests/
    - name: Type check
      run: uv run ty check src/ tests/

  build-wheels:
    name: Build wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - name: Build wheels
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.build }}
      uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
    - name: Upload wheels
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.dist }}
        path: ./wheelhouse/*.whl
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-26,         arch: x86_64, build: "cp3{10,11,12,13,14}-*",          dist: macos-amd}
        - {os: macos-26,         arch: arm64,  build: "cp3{10,11,12,13,14}-*",          dist: macos-arm}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-amd}
        - {os: ubuntu-24.04,     arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-amd}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-manylinux*", dist: manylinux-arm}
        - {os: ubuntu-24.04-arm, arch: auto,   build: "cp3{10,11,12,13,14}-musllinux*", dist: musllinux-arm}
        - {os: windows-latest,   arch: AMD64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-amd}
        - {os: windows-11-arm,   arch: ARM64,  build: "cp3{10,11,12,13,14}-*",          dist: windows-arm}

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "${{ matrix.python-version }}"
    - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ matrix.os }}
        restore-keys: ${{ matrix.os }}
    - name: Setup audio
      uses: supriya-project/setup-audio@4bdbed1b96a1ff0c3346e74c746fa0d9a8fb387c # v1.0.0
    - name: Setup SuperCollider
      uses: supriya-project/setup-supercollider@c30b38cc8fe88b5aa1e58b8da86b588d53af9d7d # v1.1.2
    - name: Install supriya-shm
      run: uv sync
    - name: Test
      run: uv run pytest -v
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
        - {os: macos-26-intel,   python-version: "3.14"}
        - {os: macos-26,         python-version: "3.14"}
        - {os: ubuntu-24.04-arm, python-version: "3.14"}
        - {os: windows-latest,   python-version: "3.14"}
        - {os: windows-11-arm,   python-version: "3.14"}

  test-wheels:
    name: Test wheels
    needs: build-wheels
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ matrix.os }}
        restore-keys: ${{ matrix.os }}
    - name: Setup audio
      uses: supriya-project/setup-audio@4bdbed1b96a1ff0c3346e74c746fa0d9a8fb387c # v1.0.0
    - name: Setup SuperCollider
      uses: supriya-project/setup-supercollider@c30b38cc8fe88b5aa1e58b8da86b588d53af9d7d # v1.1.2
    - name: Download wheels
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist-${{ matrix.dist }}
        path: dist
    - name: List wheels
      run: ls -l dist/
    - name: Install wheel
      run: pip install ./dist/*cp314*
      shell: bash
    - name: Install pytest
      run: pip install pytest pytest-cov
    - name: Test
      run: pytest -v
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: macos-26-intel,   dist: macos-amd}
        - {os: macos-26,         dist: macos-arm}
        - {os: ubuntu-24.04,     dist: manylinux-amd}
        - {os: ubuntu-24.04-arm, dist: manylinux-arm}
        - {os: windows-latest,   dist: windows-amd}
        - {os: windows-11-arm,   dist: windows-arm}
